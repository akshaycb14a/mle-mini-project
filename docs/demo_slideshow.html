<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Demo Slides</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #0f766e;
      --border: #d6d3d1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, #fff8e7 0, transparent 30%),
        linear-gradient(135deg, #f3efe6 0%, #ece7dd 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .deck {
      width: min(980px, 100%);
      min-height: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(31, 41, 51, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar,
    .bottombar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .bottombar {
      border-bottom: 0;
      border-top: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .slide {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 64px;
      gap: 20px;
    }

    .slide h1 {
      margin: 0;
      font-size: clamp(2rem, 4.8vw, 4rem);
      line-height: 1.1;
    }

    .slide p {
      margin: 0;
      font-size: clamp(1.15rem, 2.1vw, 1.75rem);
      line-height: 1.5;
      color: #334155;
    }

    .slide .tag {
      display: inline-block;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: #d1fae5;
      color: #065f46;
      font-size: 0.95rem;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
    }

    button.secondary {
      background: #e7e5e4;
      color: var(--text);
    }

    @media (max-width: 720px) {
      .slide {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="deck">
    <div class="topbar">
      <div class="title">ML on Edge Demo</div>
      <div id="counter" class="hint">1 / 1</div>
    </div>

    <div class="slide">
      <div id="tag" class="tag"></div>
      <h1 id="heading"></h1>
      <p id="body"></p>
    </div>

    <div class="bottombar">
      <div></div>
      <div>
        <button id="prev" class="secondary">Previous</button>
        <button id="next">Next</button>
      </div>
    </div>
  </div>

  <script>
    const slides = [
      {
        tag: "Slide 1",
        heading: "Cold-chain monitoring on the edge",
        body: "This demo shows sensor simulation, preprocessing, TFLite inference, drift monitoring, and deployment support."
      },
      {
        tag: "Slide 2",
        heading: "Training the model",
        body: "Now I switch to the terminal and run the training script to generate the model and evaluation outputs."
      },
      {
        tag: "Slide 3",
        heading: "Live stack starts first",
        body: "MQTT, inference, and PSI monitoring are started together so the project behaves like a small edge system."
      },
      {
        tag: "Slide 4",
        heading: "Sensor simulator publishes readings",
        body: "The simulator supports four modes: none, temp_drift, vibration, and combined."
      },
      {
        tag: "Slide 5",
        heading: "Preprocessing happens in streaming mode",
        body: "The pipeline uses a 5-sample moving average, 30-second window, 10-second step, and six required features."
      },
      {
        tag: "Slide 6",
        heading: "Real-time predictions are produced",
        body: "Each ready window is normalized with saved training statistics and passed to the TFLite model for classification."
      },
      {
        tag: "Slide 7",
        heading: "MQTT and logs show the outputs",
        body: "Inference results are published back to MQTT and also stored in logs and the local database."
      },
      {
        tag: "Slide 8",
        heading: "Normalization experiment is included",
        body: "The project compares accuracy with correct statistics and with statistics shifted by 3 standard deviations."
      },
      {
        tag: "Slide 9",
        heading: "Three deployment models are benchmarked",
        body: "The repository includes FP32, full INT8, and pruned INT8 TFLite models with latency, size, accuracy, energy, and class-2 recall."
      },
      {
        tag: "Slide 10",
        heading: "PSI monitoring detects drift",
        body: "Reference confidence bins are saved from clean data, and the live monitor raises an alert when PSI goes above 0.25."
      },
      {
        tag: "Slide 11",
        heading: "Docker and Ansible cover deployment",
        body: "The container supports model-path configuration and the playbook updates the model and restarts the service in a simple way."
      },
      {
        tag: "Slide 12",
        heading: "The web app helps present the system",
        body: "It shows monitoring metrics, predictions, sensor controls, and generated reports from the same project files."
      }
    ];

    let index = 0;

    const tag = document.getElementById("tag");
    const heading = document.getElementById("heading");
    const body = document.getElementById("body");
    const counter = document.getElementById("counter");

    function render() {
      const slide = slides[index];
      tag.textContent = slide.tag;
      heading.textContent = slide.heading;
      body.textContent = slide.body;
      counter.textContent = `${index + 1} / ${slides.length}`;
    }

    function nextSlide() {
      if (index < slides.length - 1) {
        index += 1;
        render();
      }
    }

    function prevSlide() {
      if (index > 0) {
        index -= 1;
        render();
      }
    }

    document.getElementById("next").addEventListener("click", nextSlide);
    document.getElementById("prev").addEventListener("click", prevSlide);

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
        nextSlide();
      }
      if (event.key === "ArrowLeft" || event.key === "PageUp") {
        prevSlide();
      }
    });

    render();
  </script>
</body>
</html>
