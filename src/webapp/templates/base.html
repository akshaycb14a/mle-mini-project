<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Edge Monitoring Demo" }}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
        color: #1f2933;
      }
      nav {
        background: #17324d;
        padding: 14px 24px;
      }
      nav a {
        color: #ffffff;
        text-decoration: none;
        margin-right: 18px;
        font-weight: 600;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .panel {
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }
      h1, h2, h3 {
        margin-top: 0;
      }
      .metric {
        font-size: 28px;
        font-weight: 700;
        margin: 8px 0;
      }
      .label {
        color: #52606d;
        font-size: 14px;
      }
      .status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #d9e2ec;
        font-size: 13px;
      }
      .status.running {
        background: #d9f99d;
      }
      .status.stopped {
        background: #fecaca;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border-bottom: 1px solid #d9e2ec;
        text-align: left;
        padding: 8px;
        font-size: 14px;
      }
      button {
        background: #17324d;
        color: #ffffff;
        border: 0;
        border-radius: 4px;
        padding: 10px 14px;
        cursor: pointer;
        margin-right: 8px;
      }
      input, select {
        padding: 8px;
        border: 1px solid #bcccdc;
        border-radius: 4px;
        margin-right: 8px;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 13px;
      }
      img {
        max-width: 100%;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="{{ url_for('monitoring_page') }}">Monitoring</a>
      <a href="{{ url_for('sensors_page') }}">Sensor Runs</a>
      <a href="{{ url_for('reports_page') }}">Reports</a>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
